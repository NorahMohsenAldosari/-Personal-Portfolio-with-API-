<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    text-align: center;
}

.container {
    background: white;
    width: 350px;
    margin: 60px auto;
    padding: 20px;
    border-radius: 10px;
}

input {
    padding: 10px;
    width: 70%;
}

button {
    padding: 10px;
    cursor: pointer;
    background: #007BFF;
    color: white;
    border: none;
}

li {
    list-style: none;
    padding: 10px;
    margin-top: 10px;
    background: #eee;
    cursor: pointer;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">
    <h2>My To-Do List</h2>

    <input id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") return;

    let li = document.createElement("li");
    li.textContent = task;

    li.onclick = function () {
        this.remove();
        saveTasks();
    };

    document.getElementById("taskList").appendChild(li);

    input.value = "";
    saveTasks();
}

function saveTasks() {
    let tasks = [];
    document.querySelectorAll("#taskList li").forEach(li => {
        tasks.push(li.textContent);
    });
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function loadTasks() {
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    tasks.forEach(task => {
        let li = document.createElement("li");
        li.textContent = task;

        li.onclick = function () {
            this.remove();
            saveTasks();
        };

        document.getElementById("taskList").appendChild(li);
    });
}

loadTasks();
</script>

</body>
</html>
